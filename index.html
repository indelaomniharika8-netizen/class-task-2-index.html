<!DOCTYPE html>
<html>
<head>
    <title>My Web Page</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: lightpink;
            margin-top: 100px;
        }

        .box {
            background-color: white;
            width: 400px;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
        }

        h1 {
            color: darkblue;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            background-color: purple;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background-color: darkviolet;
        }
    </style>
</head>

<body>

    <div class="box">
        <h1>Welcome to My Website</h1>
         <h2>Git Branches Task 2</h2>
        <p>Hello! This is my Git Branches Task 2.</p>

        <p>I created this webpage using HTML and CSS.</p>

        <button onclick="showMessage()">Click Me</button>

        <p id="message"></p>
    </div>

    <script>
        function showMessage() {
            document.getElementById("message").innerHTML =
                "Hello! Feature branch is working successfully!";
        }
    </script>

</body>
</html>
